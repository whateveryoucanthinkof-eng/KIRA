<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!--
    cyberworld mark — the kill chain in miniature.
    Three solid bars are observed stages escalating; the hollow fourth is the
    forecast. Same encoding the console uses, same palette: warm ink ground,
    bone marks, no radius, no gradient.
  -->
  <rect width="48" height="48" fill="#0A0A09"/>
  <rect x="6"  y="30" width="7" height="11" fill="#F2EFE6"/>
  <rect x="16" y="23" width="7" height="18" fill="#F2EFE6"/>
  <rect x="26" y="15" width="7" height="26" fill="#F2EFE6"/>
  <rect x="36.5" y="7.5" width="6" height="33" fill="none" stroke="#7D8CA1" stroke-width="1.5"/>
</svg>
