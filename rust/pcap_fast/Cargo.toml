[package]
name = "pcap_fast"
version = "0.1.0"
edition = "2021"
description = "Experimental bit-exact Rust port of the PCAP -> host-window flow parsing hot path"

# No dependencies on purpose: no maturin/PyO3, nothing to install. The binary
# streams a columnar binary format on stdout that pcap_fast_py.py reads.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
